<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macrun · 桌面交互设计</title><style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#23322e;--green:#26745d;--muted:#738078;--line:#e5eae6;--panel:#ffffff;--bg:#f7f9f6}*{box-sizing:border-box}body{margin:0;background:#dce6de}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent;border-radius:8px;padding:8px 12px}button:hover{background:#e7eee8}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #78b59b;outline-offset:2px}button:disabled{opacity:.5;cursor:default}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.7px}h2{font-size:18px;letter-spacing:-.4px}h3{font-size:13px}small,.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.pill{border-radius:20px;font-size:11px;padding:4px 9px;background:#e6f2eb;color:var(--green);white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:currentColor;border-radius:100%;margin-right:5px}.amber{background:#fbefda;color:#99631d}.red{background:#f9e8e4;color:#ad5343}.primary{background:var(--green);color:white}.primary:hover{background:#205e4c}.secondary{background:#eff3ef;border:1px solid #e0e7df}.toolbar{padding:18px 32px;background:#f5f7f1;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #cdd8cd;gap:12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#71816c;font-weight:650}.toolbar strong{font-size:16px}.switcher{display:flex;background:#e6ebe3;padding:3px;border-radius:9px}.switcher button{font-size:12px;padding:6px 13px}.switcher .selected{background:white;box-shadow:0 1px 4px #0001}.desktop{min-height:calc(100vh - 84px);position:relative;padding:80px 38px 68px;background:radial-gradient(ellipse at 9% 80%,#b0c2b4 0,transparent 55%),radial-gradient(ellipse at 95% 12%,#eae7d9 0,transparent 60%),#dbe4da}.systembar{position:absolute;top:0;left:0;right:0;height:33px;padding:0 27px;background:#f6f8ee60;backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center;font-size:12px}.systembar button{padding:3px 11px}.traytrigger{background:#ffffff60;border:1px solid #ffffff60;font-weight:700}.desktop.windows .systembar{top:auto;bottom:0;height:44px;background:#f6f8eef0}.workspace{max-width:1050px;margin:auto;display:grid;grid-template-columns:205px 1fr;min-height:618px;border:1px solid #fff9;border-radius:15px;overflow:hidden;box-shadow:0 26px 75px #344e3b25,0 3px 12px #25322610;background:white}.sidebar{background:#f0f4edda;padding:22px 14px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.lights{display:flex;gap:7px;margin:0 0 30px 6px}.lights button{padding:0;height:12px;width:12px;border-radius:50%;background:#e6bd55}.lights button:first-child{background:#e58075}.lights button:last-child{background:#8eb481}.brand{padding:0 10px 24px;display:flex;gap:11px;align-items:center}.mark{background:#294f40;color:#fff;border-radius:12px;font-size:23px;width:40px;height:40px;display:grid;place-items:center;font-weight:600}.brand strong{font-size:18px;letter-spacing:-.5px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;display:flex;gap:12px;padding:10px 12px;color:#657166}.nav button.active{background:#dee8dc;color:#2c5945;font-weight:600}.nav i{font-style:normal;width:18px;text-align:center}.device{margin-top:auto;background:#ffffff8c;padding:13px;border:1px solid #e0e7dc;border-radius:10px}.device small{font-size:11px}.main{padding:32px 34px;min-width:0;background:var(--bg)}.subtitle{font-size:12px;color:var(--muted);margin-top:5px}.section{margin-top:24px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:19px}.connection{display:flex;align-items:center;gap:15px}.connection .icon{width:45px;height:45px;border-radius:12px;background:#eaf1e8;display:grid;place-items:center;color:var(--green);font-size:21px}.connection .actions{margin-left:auto}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.stat{padding:17px 19px}.stat strong{font-size:27px;font-weight:600;letter-spacing:-1px}.stat small{display:block;font-size:11px}.sectiontitle{margin-bottom:10px}.running{border-left:3px solid #6b9c72}.progress{height:4px;border-radius:4px;background:#ebf0e8;margin:14px 0 9px;overflow:hidden}.progress span{display:block;width:56%;height:100%;background:#83a783}.taskrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 5px;border-bottom:1px solid #edf0eb;border-radius:0}.taskrow:last-child{border:0}.taskrow .statusicon{background:#eaf3eb;color:#5a8661;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}.taskrow .failed{color:#b5644e;background:#f8e9e2}.taskrow .taskmeta{margin-left:auto;text-align:right;color:var(--muted);font-size:11px}.taskrow strong{font-size:12px;font-weight:550}.taskrow small{font-size:11px}.tiny{font-size:11px}.filters{display:flex;gap:5px;flex-wrap:wrap;margin:18px 0 12px}.filters button{font-size:12px}.filters .active{background:#e1ebde;color:#315c40}.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:white}.field{margin-top:18px}.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.field input{width:100%;padding:10px 12px;border:1px solid #dbe2d8;border-radius:8px;background:#fff}.field small{display:block;margin-top:5px;font-size:11px}.settingrow{padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.settingrow:last-child{border:0}.toggle{appearance:none;width:34px;height:20px;border-radius:20px;background:#cdd5cd;position:relative;cursor:pointer;flex-shrink:0}.toggle:checked{background:var(--green)}.toggle:before{content:'';position:absolute;width:16px;height:16px;border-radius:100%;background:white;left:2px;top:2px;box-shadow:0 1px 3px #0002;transition:transform .15s}.toggle:checked:before{transform:translateX(14px)}.notice{padding:12px 14px;background:#f7ecdc;border-radius:8px;font-size:12px;color:#936827;margin-top:16px}.footnote{position:relative;text-align:center;margin:23px auto 0;font-size:11px;color:#53694e}.popover{position:absolute;z-index:4;right:130px;top:39px;width:355px;background:#f8faf6f5;backdrop-filter:blur(30px);border:1px solid white;border-radius:14px;box-shadow:0 18px 65px #19342635;padding:19px;max-height:calc(100vh - 155px);overflow:auto;transform-origin:top right}.windows .popover{top:auto;bottom:52px;transform-origin:bottom right}.popover .card{padding:12px}.popover .section{margin-top:16px}.popover h2{font-size:16px}.popover .statgrid{gap:6px}.popover .stat{padding:10px}.popover .stat strong{font-size:21px}.popoverfooter{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.overlay{position:fixed;inset:0;background:#1d342b40;backdrop-filter:blur(5px);z-index:10;display:grid;place-items:center;padding:20px}.dialog{background:var(--bg);border:1px solid #fff;border-radius:16px;padding:26px;width:540px;max-width:100%;max-height:85vh;overflow:auto;box-shadow:0 30px 100px #18312540}.dialog pre{padding:17px;background:#24362e;color:#dce9da;border-radius:9px;font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.details{display:grid;grid-template-columns:80px 1fr;gap:9px;font-size:12px;margin:20px 0}.details span:nth-child(odd){color:var(--muted)}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#263e32;color:#fff;border:1px solid #ffffff30;padding:12px 20px;border-radius:10px;box-shadow:0 6px 24px #0002;z-index:20;font-size:12px;max-width:90vw}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.hidden{display:none!important}.stagecontrols{display:flex;gap:10px;align-items:center}.stagecontrols select{padding:6px 10px;border:1px solid #d5ded1;background:#fff;border-radius:7px;font-size:12px}.onboard{max-width:460px;margin:22px auto}.onboard .mark{margin-bottom:20px}.badge{font-size:10px;border:1px solid #cdd9c7;padding:2px 7px;border-radius:4px;color:#697c5c}.error{color:#b35143;font-size:12px;margin-top:10px}.desktop.windows .lights{visibility:hidden}@media(max-width:800px){.toolbar{padding:13px 16px;flex-wrap:wrap}.desktop{padding:60px 16px}.workspace{grid-template-columns:155px 1fr}.main{padding:25px 20px}.sidebar{padding:18px 10px}.brand{padding-left:0;gap:7px}.popover{right:20px}.stagecontrols{flex-wrap:wrap}}@media(max-width:580px){.workspace{display:block;min-height:650px}.sidebar{padding:12px}.lights,.brand,.device{display:none}.nav{flex-direction:row}.nav button{flex:1;justify-content:center;padding:8px 2px;font-size:12px}.main{padding:22px 16px}.statgrid{gap:7px}.stat{padding:12px}.connection{flex-wrap:wrap}.connection .actions{margin-left:0}.systembar .sysleft span{display:none}.popover{right:12px;width:calc(100% - 24px)}.toolbar .muted{display:none}.stagecontrols{gap:5px}.desktop{padding:53px 10px 60px}.dialog{padding:20px}.footnote{padding:0 12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(prefers-reduced-transparency:reduce){.popover,.systembar{background:#f6f8f2;backdrop-filter:none}}</style>
<body><header class="toolbar"><div><div class="eyebrow">MACRUN / DESKTOP STUDY 01</div><div class="row"><strong>让远端任务，在本机安心运行。</strong><span class="badge">交互设计稿</span></div></div><div class="stagecontrols"><div class="switcher"><button id="mac" class="selected" onclick="platform('mac')">macOS</button><button id="win" onclick="platform('win')">Windows</button></div><select aria-label="预览场景" id="scenario" onchange="scene(this.value)"><option value="connected">已连接 · 任务执行中</option><option value="offline">连接中断</option><option value="first">首次连接</option></select><button class="tiny" onclick="resetDemo()">重置演示</button></div></header>
<div class="desktop" id="desktop"><div class="systembar"><div class="row sysleft"><b id="osmark">●</b><b>Macrun</b><span>文件　 编辑　 窗口　 帮助</span></div><div class="row"><button class="traytrigger" aria-label="打开 Macrun 托盘面板" aria-expanded="false" id="traybtn" onclick="toggleTray()">⌁ <span id="traydot">●</span></button><span>◒　▰</span><span>周日 10:24</span></div></div><div class="workspace" id="workspace"><aside class="sidebar"><div class="lights"><button aria-label="关闭窗口并保留托盘" onclick="hideWindow()"></button><button aria-label="最小化窗口" onclick="hideWindow()"></button><button aria-label="切换宽屏" onclick="document.getElementById('workspace').style.maxWidth=document.getElementById('workspace').style.maxWidth?'':'1200px'"></button></div><div class="brand"><div class="mark">⌁</div><div><strong>Macrun</strong><div class="tiny muted">你的本机执行伙伴</div></div></div><nav class="nav"><button id="nav-overview" onclick="nav('overview')"><i>▦</i>概览</button><button id="nav-activity" onclick="nav('activity')"><i>≡</i>活动记录</button><button id="nav-settings" onclick="nav('settings')"><i>⚙</i>设置</button></nav><div class="device"><div class="row"><span>▣</span><strong class="tiny" id="device">我的 Mac mini</strong></div><small>仅在此设备上执行任务</small><div style="margin-top:9px" class="tiny muted">设计预览 · 模拟数据</div></div></aside><main class="main" id="main"></main></div><p class="footnote">点击系统栏中的 ⌁ 打开快捷面板 · 所有连接、任务和权限均为演示，不会操作你的电脑</p><section class="popover hidden" id="popover" aria-label="Macrun 快捷面板"></section></div><div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"></div><div class="toast hidden" id="toast" role="status"></div>
<script>
let current='overview',paused=false,online=true,first=false,os='mac',filter='全部',query='',tray=false,modalTask=null,lastFocus=null;let config={server:'dev-server.example:7443',device:'我的 Mac mini',auto:true,connect:true};let tasks=[];function seed(){tasks=[{id:'mr-024',name:'运行项目测试',type:'命令',project:'notes-app',status:'执行中',time:'10:24',duration:'32 秒',cmd:'cargo test --workspace',log:'Running 18 tests…\ntest config::load ... ok\ntest sync::transfer ... ok\n等待其余测试完成。'},{id:'mr-023',name:'同步项目文件',type:'文件',project:'notes-app',status:'成功',time:'10:23',duration:'1.2 秒',cmd:'sync notes-app',log:'12 个文件已更新\n传输 248 KB\n同步完成。'},{id:'mr-022',name:'获取应用截图',type:'桌面',project:'notes-app',status:'成功',time:'10:21',duration:'0.8 秒',cmd:'computer.screenshot',log:'已返回截图（本设计稿不包含真实截图）。'},{id:'mr-021',name:'启动桌面应用',type:'桌面',project:'notes-app',status:'失败',time:'10:19',duration:'2.1 秒',cmd:'computer.launch',log:'桌面后端未获得辅助功能权限。\n请在本机系统设置中允许访问，再重新发起任务。'},{id:'mr-020',name:'读取构建结果',type:'文件',project:'notes-app',status:'成功',time:'10:18',duration:'0.2 秒',cmd:'file.read build/report.txt',log:'构建完成，共 0 个错误。'},{id:'mr-019',name:'检查运行环境',type:'命令',project:'notes-app',status:'成功',time:'10:16',duration:'0.4 秒',cmd:'hostname',log:'demo-device'}]};seed();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const state=()=>!online?'连接已断开':paused?'已暂停接收':'已连接';const badge=()=>`<span class="pill ${!online?'red':paused?'amber':''}"><span class="dot"></span>${state()}</span>`;const running=()=>tasks.filter(t=>t.status==='执行中');function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),3200)}
function taskRows(list){return list.map(t=>`<button class="taskrow" onclick="detail('${t.id}')"><span class="statusicon ${t.status==='失败'?'failed':''}">${t.status==='失败'?'!':t.status==='执行中'?'◷':'✓'}</span><span><strong>${esc(t.name)}</strong><br><small>${t.type} · ${t.project}</small></span><span class="taskmeta">${t.status} · ${t.duration}<br>${t.time}</span></button>`).join('')||'<div class="empty">没有匹配的任务</div>'}
function stats(){let success=tasks.filter(t=>t.status==='成功').length,fail=tasks.filter(t=>t.status==='失败').length;return `<div class="statgrid"><div class="card stat"><small>今日任务</small><strong>${tasks.length}</strong></div><div class="card stat"><small>已成功</small><strong>${success}</strong></div><div class="card stat"><small>失败</small><strong style="color:#ae7058">${fail}</strong></div></div>`}
function activeCard(){let t=running()[0];return t?`<div class="card running"><div class="row between"><div><h3>${esc(t.name)}</h3><small>${t.project} · ${t.type}</small></div><span class="pill ${!online?'amber':''}">${online?'执行中':'状态待确认'}</span></div><div class="progress"><span></span></div><div class="row between"><small>${online?'已运行 32 秒 · 等待执行结果':'连接恢复后查询结果，不自动重跑'}</small><button class="tiny" onclick="detail('${t.id}')">查看详情 ↗</button></div></div>`:`<div class="card"><h3>${paused?'已暂停接收新任务':'准备就绪'}</h3><small>${paused?'恢复后即可接收远端请求。':'新任务会自动显示在这里。'}</small></div>`}
function overview(){return `<div class="row between"><div><h1>概览</h1><p class="subtitle">远端发起，本机执行。一切进展都在这里。</p></div>${badge()}</div><div class="card connection section"><div class="icon">⇄</div><div><h3>${online?'已连接到开发服务器':'暂时无法连接服务器'}</h3><small>${esc(config.server)}</small></div><div class="actions"><button class="secondary tiny" onclick="${online?'pause()':'reconnect()'}">${online?(paused?'恢复接收':'暂停接收'):'重新连接'}</button></div></div>${!online?'<div class="notice">演示：网络连接中断。正在执行的任务不会自动重新提交。</div>':paused?'<div class="notice">已暂停新任务。现有任务会继续执行。</div>':''}${stats()}<p class="tiny muted" style="margin-top:8px">按任务编号去重统计，不含心跳和进度查询。</p><div class="section"><div class="row between sectiontitle"><h3>当前任务</h3><small>${running().length} 个进行中</small></div>${activeCard()}</div><div class="section"><div class="row between sectiontitle"><h3>最近活动</h3><button class="tiny" onclick="nav('activity')">查看全部 →</button></div><div class="card" style="padding:2px 13px">${taskRows(tasks.slice(1,4))}</div></div>`}
function activity(){return `<div class="row between"><div><h1>活动记录</h1><p class="subtitle">每次执行，都有迹可循。</p></div><span class="badge">今天 · ${tasks.length} 项</span></div><div class="filters">${['全部','执行中','成功','失败'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><input class="search" aria-label="搜索任务" placeholder="搜索任务、项目或类型…" value="${esc(query)}" oninput="query=this.value;updateRows()"><div class="card section" style="padding:3px 15px" id="tasklist">${filteredRows()}</div><p class="tiny muted section">点击任务查看命令、输出和错误原因。演示记录仅保留在当前页面。</p>`}
function filteredRows(){return taskRows(tasks.filter(t=>(filter==='全部'||t.status===filter)&&(t.name+t.project+t.type).toLowerCase().includes(query.toLowerCase())))}function updateRows(){document.getElementById('tasklist').innerHTML=filteredRows()}
function settings(){return `<h1>设置</h1><p class="subtitle">连接你的服务器，让 Macrun 随时就绪。</p><form onsubmit="save(event)" class="card section"><h3>服务器连接</h3><div class="field"><label for="server">服务器地址</label><input id="server" required value="${esc(config.server)}" placeholder="server.example:7443"><small>输入服务器域名或 IP，以及端口。</small></div><div class="field"><label for="name">设备名称</label><input id="name" required value="${esc(config.device)}"></div><div class="field"><label for="token">连接凭据</label><input id="token" type="password" autocomplete="off" placeholder="已配置 · 输入新凭据可替换"><small>本设计稿不保存凭据，请勿输入真实密钥。</small></div><div class="row" style="margin-top:18px"><button class="primary" type="submit">保存设置</button><button type="button" class="secondary" onclick="testConnection()">测试连接</button><small id="connection-result" aria-live="polite"></small></div></form><div class="card section"><h3>运行方式</h3><div class="settingrow"><div>登录时启动<small style="display:block">登录电脑后，自动在${os==='mac'?'菜单栏':'托盘'}运行</small></div><input class="toggle" type="checkbox" aria-label="登录时启动" ${config.auto?'checked':''} onchange="config.auto=this.checked;toast('已更新演示设置')"></div><div class="settingrow"><div>启动后自动连接<small style="display:block">使用已保存的服务器配置</small></div><input class="toggle" type="checkbox" aria-label="启动后自动连接" ${config.connect?'checked':''} onchange="config.connect=this.checked;toast('已更新演示设置')"></div></div><div class="card section"><div class="row between"><div><h3>桌面操作</h3><small>与命令执行分别检查</small></div><span class="pill">演示：可用</span></div><div class="settingrow"><small>${os==='mac'?'辅助功能、屏幕录制权限已配置':'桌面后端已连接，当前会话可用'}</small><button class="secondary tiny" onclick="toast('模拟检查完成：桌面后端及权限可用')">检查状态</button></div></div>`}
function onboarding(){return `<div class="onboard"><div class="mark">⌁</div><span class="eyebrow">WELCOME TO MACRUN</span><h1 style="margin-top:9px">把这台电脑，连接到你的 Agent。</h1><p class="subtitle" style="line-height:1.8;margin-top:12px">连接已有的 Macrun 服务器后，远端 Agent 就能将任务交给这台电脑。你可以随时在菜单栏暂停接收。</p><form class="card section" onsubmit="pair(event)"><h3>连接你的服务器</h3><div class="field"><label for="pairserver">服务器地址</label><input id="pairserver" required placeholder="server.example:7443" value="dev-server.example:7443"></div><div class="field"><label for="pairtoken">连接凭据</label><input id="pairtoken" required type="password" placeholder="使用 demo 体验连接" value="demo"><small>模拟配对，不会连接网络。请勿输入真实凭据。</small></div><div class="field"><label>服务器证书</label><button type="button" class="secondary" onclick="document.getElementById('certname').textContent='demo-cert.der · 已选用示例证书'">选用示例证书</button><small id="certname">演示默认使用示例证书；正式版需校验服务器身份。</small></div><button class="primary" style="width:100%;margin-top:22px">连接并开始使用</button></form><p class="tiny muted section">需要已有的 Linux 服务端。本设计稿只演示本机客户端。</p></div>`}
function render(){document.getElementById('main').innerHTML=first?onboarding():current==='overview'?overview():current==='activity'?activity():settings();for(let n of ['overview','activity','settings'])document.getElementById('nav-'+n).classList.toggle('active',n===current&&!first);document.getElementById('device').textContent=config.device;document.getElementById('traydot').style.color=first?'#859184':!online?'#b06451':paused?'#b4904e':'#41825e';if(tray)renderTray()}
function nav(n){current=n;first=false;document.getElementById('workspace').classList.remove('hidden');closeTray();render()}
function pause(){paused=!paused;render();toast(paused?'已暂停接收新任务，现有任务继续执行':'已恢复接收新任务')}
function reconnect(){online=true;document.getElementById('scenario').value='connected';render();toast('模拟连接已恢复，未重新提交任何任务')}
function toggleTray(){tray=!tray;document.getElementById('popover').classList.toggle('hidden',!tray);document.getElementById('traybtn').setAttribute('aria-expanded',tray);if(tray)renderTray()}
function closeTray(){tray=false;document.getElementById('popover').classList.add('hidden');document.getElementById('traybtn').setAttribute('aria-expanded','false')}
function renderTray(){document.getElementById('popover').innerHTML=first?`<div class="row between"><h2>Macrun</h2><span class="pill amber">尚未连接</span></div><p class="subtitle section">先连接服务器，开始接收任务。</p><button class="primary section" onclick="closeTray();document.getElementById('workspace').classList.remove('hidden')">配置连接</button>`:`<div class="row between"><div class="row"><div class="mark" style="width:29px;height:29px;font-size:18px;border-radius:8px">⌁</div><h2>Macrun</h2></div>${badge()}</div><p class="subtitle" style="margin:12px 0">${esc(config.device)} · ${online?'执行程序运行中':'等待服务器恢复'}</p>${paused?'<div class="notice">暂停接收中，现有任务继续执行。</div>':''}${activeCard()}${stats()}<div class="section"><div class="row between"><h3>最近活动</h3><button class="tiny" onclick="nav('activity')">全部 →</button></div>${taskRows(tasks.slice(1,3))}</div><button class="secondary" style="width:100%;margin-top:10px" onclick="${online?'pause()':'reconnect()'}">${online?(paused?'恢复接收新任务':'暂停接收新任务'):'重新连接'}</button><div class="row between popoverfooter"><button class="tiny" onclick="nav('settings')">⚙ 设置</button><button class="tiny" onclick="nav('overview')">打开主窗口</button><button class="tiny" onclick="quit()">退出</button></div>`}
function showDialog(html){lastFocus=document.activeElement;let el=document.getElementById('overlay');el.innerHTML=`<div class="dialog">${html}</div>`;el.classList.remove('hidden');el.querySelector('button')?.focus()}
function closeDialog(){document.getElementById('overlay').classList.add('hidden');lastFocus?.focus()}
function detail(id){modalTask=tasks.find(t=>t.id===id);let t=modalTask;showDialog(`<div class="row between"><h2 id="dialogtitle">${t.name}</h2><button aria-label="关闭任务详情" onclick="closeDialog()">✕</button></div><div class="details"><span>任务状态</span><span>${!online&&t.status==='执行中'?'状态待确认':t.status}</span><span>任务编号</span><span>${t.id}</span><span>工作目录</span><span>${os==='mac'?'/Users/demo/Projects/notes-app':'C:\\Projects\\notes-app'}</span><span>时间 / 耗时</span><span>${t.time} / ${t.duration}</span><span>操作</span><span>${esc(t.cmd)}</span></div><h3>执行输出</h3><pre>${esc(t.log)}</pre>${t.status==='失败'?'<div class="notice">本次任务已结束。检查桌面权限后，由 Agent 决定是否重新发起。</div>':''}<div class="row between section"><button class="secondary" onclick="copyTask()">复制任务信息</button>${t.status==='执行中'?'<button class="primary" onclick="finishTask()">模拟任务完成</button>':'<button class="primary" onclick="closeDialog()">完成</button>'}</div>`)}
async function copyTask(){let t=modalTask;try{await navigator.clipboard.writeText(`${t.id}\n${t.name}\n${t.status}\n${t.log}`);toast('已复制任务信息')}catch{toast('浏览器不允许复制，可在输出区域手动选择文本')}}
function finishTask(){modalTask.status='成功';modalTask.duration='41 秒';modalTask.log='test result: ok. 18 passed; 0 failed\nexit code: 0';closeDialog();render();toast('演示任务已完成，统计和活动记录已更新')}
function save(e){e.preventDefault();let s=document.getElementById('server').value.trim(),name=document.getElementById('name').value.trim();if(!validServer(s)||!name){toast('请填写设备名称及有效地址，例如 server.example:7443');return}config.server=s;config.device=name;render();toast('设置已保存到当前演示，不保存连接凭据')}
function validServer(s){return /^\S+:\d{1,5}$/.test(s)&&Number(s.split(':').pop())>0&&Number(s.split(':').pop())<65536}
function testConnection(){let s=document.getElementById('server').value.trim(),el=document.getElementById('connection-result');el.textContent=!validServer(s)?'请检查地址与端口':online?'模拟连接成功':'模拟连接失败：服务器不可达';el.style.color=online&&validServer(s)?'#26745d':'#ad5343'}
function pair(e){e.preventDefault();let s=document.getElementById('pairserver').value.trim();if(!validServer(s)){toast('请输入有效的服务器地址和端口');return}config.server=s;first=false;online=true;paused=false;current='overview';document.getElementById('scenario').value='connected';render();toast('模拟连接成功，开始接收任务')}
function platform(p){os=p;document.getElementById('desktop').classList.toggle('windows',p==='win');document.getElementById('mac').classList.toggle('selected',p==='mac');document.getElementById('win').classList.toggle('selected',p==='win');config.device=p==='mac'?'我的 Mac mini':'我的 Windows PC';document.getElementById('osmark').textContent=p==='mac'?'●':'⊞';render()}
function scene(s){first=s==='first';online=s!=='offline';paused=false;current='overview';closeTray();document.getElementById('workspace').classList.remove('hidden');render()}
function hideWindow(){document.getElementById('workspace').classList.add('hidden');if(!tray)toggleTray();toast('窗口已关闭，仍在菜单栏／托盘运行')}
function quit(){showDialog(`<h2 id="dialogtitle">退出 Macrun？</h2><p class="subtitle section">${running().length?'仍有 1 个任务执行中。退出会停止本机执行程序，并可能中断任务。':'退出后，这台电脑将不再接收任务。'}</p><div class="row section" style="justify-content:flex-end"><button class="secondary" onclick="closeDialog()">继续运行</button><button class="primary" onclick="exitDemo()">退出演示应用</button></div>`)}
function exitDemo(){closeDialog();closeTray();document.getElementById('workspace').classList.add('hidden');document.getElementById('traybtn').classList.add('hidden');toast('演示应用已退出，点击“重置演示”重新打开')}
function resetDemo(){seed();paused=false;online=true;first=false;filter='全部';query='';config={server:'dev-server.example:7443',device:os==='mac'?'我的 Mac mini':'我的 Windows PC',auto:true,connect:true};document.getElementById('traybtn').classList.remove('hidden');closeDialog();document.getElementById('scenario').value='connected';scene('connected');toast('演示已重置')}
document.addEventListener('click',e=>{if(tray&&!e.target.closest('#popover')&&!e.target.closest('#traybtn')&&!e.target.closest('#overlay')&&!e.target.closest('.lights'))closeTray()});document.addEventListener('keydown',e=>{let overlay=document.getElementById('overlay');if(e.key==='Escape'){if(!overlay.classList.contains('hidden'))closeDialog();else closeTray()}if(e.key==='Tab'&&!overlay.classList.contains('hidden')){let f=[...overlay.querySelectorAll('button,input,[tabindex="0"]')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});render();
</script></body></html>

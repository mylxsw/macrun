<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macrun Desktop · 设计稿 v2</title>
<!-- Generated by build.cjs from screens/*.dc.html. Edit the sources, not index.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
:root{--ink:#1A1A19;--muted:#6B6A66;--line:#DAD9D4;--bg:#E9E8E4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 'Geist','PingFang SC','Hiragino Sans GB',system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:#FBFBFA;border-bottom:1px solid var(--line)}
.bar strong{font-size:14px;font-weight:600;white-space:nowrap}
.bar .note{color:var(--muted);font-size:12px;margin-left:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{font:inherit;font-size:13px;border:1px solid transparent;background:transparent;color:#4A4945;border-radius:7px;padding:5px 11px;cursor:pointer;min-height:32px}
.tabs button:hover{background:#EFEFEB}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.tabs button:focus-visible{outline:2px solid #2F5BEA;outline-offset:2px}
.stage{min-height:calc(100vh - 54px)}
.stage.fixed{display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-x:auto}
.stage.fixed .screen{box-shadow:0 0 0 1px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.14);border-radius:12px;overflow:hidden;flex-shrink:0}
.shot .bar{display:none}
.shot .stage{min-height:0}
.shot .stage.fixed{padding:0;display:block}
.shot .stage.fixed .screen{box-shadow:none;border-radius:0}
</style>
</head>
<body>
<header class="bar">
  <strong>Macrun Desktop · 设计稿 v2</strong>
  <nav class="tabs" role="tablist" aria-label="画板" id="tabs"></nav>
  <span class="note">所有数据均为示例，不连接服务器</span>
</header>
<main class="stage" id="stage"><div class="screen" id="screen"></div></main>
<template id="t-Main"><div class="app" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #FBFBFA">

  <nav class="nav" aria-label="主导航" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; background: #F2F2EF; border-right: 1px solid #E6E5E1; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
    <div aria-hidden="true" style="display: flex; gap: 8px; padding: 2px 4px 18px">
      <span class="dot" style="width: 12px; height: 12px; background: #EE6A5F"></span>
      <span class="dot" style="width: 12px; height: 12px; background: #F5BE4F"></span>
      <span class="dot" style="width: 12px; height: 12px; background: #62C655"></span>
    </div>
    <div class="row" style="padding: 0 6px 18px">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #1A1A19; color: #fff; display: grid; place-items: center">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5l3 3-3 3M8 11h5"></path></svg>
      </div>
      <div>
        <div style="font-weight: 600; font-size: 14.5px">Macrun</div>
        <div class="label" style="font-size: 11.5px">执行器 · v0.2.0</div>
      </div>
    </div>
    <a href="Main.dc.html" class="on"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h2.5"></path></svg>现场<span style="margin-left: auto; font-size: 11.5px; color: #2F5BEA; font-weight: 600">2</span></a>
    <a href="Tasks.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"></path></svg>任务</a>
    <a href="Desktop.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5l4 11 1.7-4.6L13.5 7z"></path></svg>桌面控制</a>
    <a href="Settings.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5 2v4.1c0 3-2.1 5.3-5 6.3-2.9-1-5-3.3-5-6.3V3.8z"></path></svg>设置与安全</a>
    <div style="flex-grow: 1; min-height: 24px"></div>
    <div style="background: #fff; border: 1px solid #E3E2DD; border-radius: 9px; padding: 10px 12px">
      <div class="row" style="gap: 8px"><span class="dot" style="background: #1F9D5C"></span><span style="font-weight: 550">已连接</span><span class="label mono" style="margin-left: auto">38 ms</span></div>
      <div class="label mono" style="margin-top: 4px">203.0.113.10:7443</div>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1 1 280px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">现场</h1>
        <p style="margin: 4px 0 0; color: #6B6A66">服务器上的 Agent 正通过 Macrun 在这台 Mac 上做的事。</p>
      </div>
      <div class="row" style="flex-wrap: wrap">
        <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
          <button class="btn" onClick="{{togglePause}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z"></path></svg>恢复接收</button>
        </sc-if>
        <sc-if value="{{notPaused}}" hint-placeholder-val="{{true}}">
          <button class="btn" onClick="{{togglePause}}"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5v9M10 3.5v9"></path></svg>暂停接收新任务</button>
        </sc-if>
        <button class="btn danger"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"></rect></svg>全部停止<span class="mono" style="font-size: 11px; color: #B4321C; opacity: .75">⌃⌥⌘.</span></button>
      </div>
    </header>

    <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
      <div class="row" style="background: #FFF6E5; border: 1px solid #F1DDB3; color: #7A4B00; border-radius: 9px; padding: 10px 14px">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5v9M10 3.5v9"></path></svg>
        <span>已暂停接收新任务。正在运行的 1 个命令会继续完成；新请求会立即返回 <span class="mono">busy</span>，Agent 可稍后重试。</span>
      </div>
    </sc-if>

    <section aria-label="三条状态" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
      <div class="card" style="padding: 14px 16px">
        <div class="row" style="gap: 8px"><span class="dot" style="background: #1F9D5C"></span><span class="label">连接</span></div>
        <div style="font-size: 16px; font-weight: 600; margin-top: 6px">已连接服务器</div>
        <div class="label" style="margin-top: 2px">QUIC · 38 ms · 已稳定 3 小时 12 分</div>
      </div>
      <div class="card" style="padding: 14px 16px">
        <div class="row" style="gap: 8px"><span class="dot" style="background: {{workerDot}}"></span><span class="label">执行器</span></div>
        <div style="font-size: 16px; font-weight: 600; margin-top: 6px">{{workerTitle}}</div>
        <div class="label" style="margin-top: 2px">{{workerDetail}}</div>
      </div>
      <div class="card" style="padding: 14px 16px">
        <div class="row" style="gap: 8px"><span class="dot" style="background: #1F9D5C"></span><span class="label">桌面控制</span></div>
        <div style="font-size: 16px; font-weight: 600; margin-top: 6px">CuaDriver 就绪</div>
        <div class="label" style="margin-top: 2px">辅助功能、屏幕录制已授权 · 屏幕未锁定</div>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

      <section style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div class="row"><h2 style="margin: 0; font-size: 15px; font-weight: 600">正在进行</h2><span class="tag">2</span></div>

        <article class="card" style="padding: 16px">
          <div class="row" style="flex-wrap: wrap">
            <span class="dot pulse" style="background: #2F5BEA"></span>
            <span class="tag" style="background: #EAF0FF; color: #2449C8">命令</span>
            <span class="label">运行中 · 已用时 <span class="mono" style="color: #1A1A19">2:14</span></span>
            <span class="label" style="margin-left: auto">阶段：编译测试目标</span>
          </div>
          <div class="mono" style="font-size: 14px; margin: 10px 0 4px; word-break: break-all">xcodebuild test -scheme Counter -destination 'platform=macOS'</div>
          <div class="label mono">~/work/Counter · task 3f2a91c0…</div>
          <div class="term mono" style="margin-top: 12px">CompileSwift normal arm64 CounterView.swift
CompileSwift normal arm64 CounterModel.swift
Ld Counter.app/Contents/MacOS/Counter
Test Suite 'CounterTests' started
  ✓ testIncrement (0.004s)
  ✓ testReset (0.002s)
  … testPersistence</div>
          <div class="row" style="margin-top: 12px; flex-wrap: wrap">
            <a href="Tasks.dc.html" class="btn" style="text-decoration: none">查看完整输出</a>
            <button class="btn ghost">在终端打开目录</button>
            <button class="btn danger" style="margin-left: auto">取消任务</button>
          </div>
        </article>

        <article class="card" style="padding: 16px">
          <div class="row" style="flex-wrap: wrap">
            <span class="dot pulse" style="background: #2F5BEA"></span>
            <span class="tag" style="background: #EEF6F0; color: #1F6B45">同步</span>
            <span class="label">接收中 · 已用时 <span class="mono" style="color: #1A1A19">0:03</span></span>
            <span class="label" style="margin-left: auto">5 个文件中已收到 3 个 · 18 KB</span>
          </div>
          <div style="font-size: 14px; margin: 10px 0 2px; font-weight: 550">Counter → <span class="mono" style="font-weight: 400">~/work/Counter</span></div>
          <div class="label">同步只更新文件，不会自动触发构建。完成前请勿依赖这个目录的内容。</div>
        </article>
      </section>

      <aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
        <section style="display: flex; flex-direction: column; gap: 10px">
          <div class="row"><h2 style="margin: 0; font-size: 15px; font-weight: 600">工作区</h2><span class="label" style="margin-left: auto">由服务器同步过来的目录</span></div>
          <div class="card">
            <sc-for list="{{workspaces}}" as="w" hint-placeholder-count="3">
              <div style="padding: 12px 14px; border-bottom: 1px solid #F0EFEB; display: flex; gap: 10px; align-items: flex-start">
                <svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="margin-top: 2px; color: #6B6A66"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H6l1.5 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
                <div style="min-width: 0; flex-grow: 1">
                  <div style="font-weight: 550">{{w.name}}</div>
                  <div class="label mono" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{w.path}}</div>
                  <div class="label" style="margin-top: 2px">{{w.meta}}</div>
                </div>
                <span class="dot" style="background: {{w.dot}}; margin-top: 6px"></span>
              </div>
            </sc-for>
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px">
          <div class="row"><h2 style="margin: 0; font-size: 15px; font-weight: 600">刚刚</h2><a href="Tasks.dc.html" style="margin-left: auto; font-size: 12.5px; text-decoration: none">全部任务</a></div>
          <div class="card" style="padding: 6px 0">
            <sc-for list="{{recent}}" as="r" hint-placeholder-count="6">
              <div style="display: flex; gap: 10px; align-items: center; padding: 7px 14px">
                <span class="mono label" style="width: 54px; flex-shrink: 0">{{r.time}}</span>
                <span class="dot" style="background: {{r.dot}}"></span>
                <span style="min-width: 0; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.text}}</span>
                <span class="label mono">{{r.dur}}</span>
              </div>
            </sc-for>
          </div>
          <div class="label">今天 42 个任务：成功 38 · 失败 2 · 未知 1 · 取消 1</div>
        </section>
      </aside>
    </div>
  </main>
</div></template>
<template id="t-Tasks"><div class="app" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #FBFBFA">

  <nav class="nav" aria-label="主导航" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; background: #F2F2EF; border-right: 1px solid #E6E5E1; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
    <div aria-hidden="true" style="display: flex; gap: 8px; padding: 2px 4px 18px">
      <span class="dot" style="width: 12px; height: 12px; background: #EE6A5F"></span>
      <span class="dot" style="width: 12px; height: 12px; background: #F5BE4F"></span>
      <span class="dot" style="width: 12px; height: 12px; background: #62C655"></span>
    </div>
    <div class="row" style="padding: 0 6px 18px">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #1A1A19; color: #fff; display: grid; place-items: center">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5l3 3-3 3M8 11h5"></path></svg>
      </div>
      <div>
        <div style="font-weight: 600; font-size: 14.5px">Macrun</div>
        <div class="label" style="font-size: 11.5px">执行器 · v0.2.0</div>
      </div>
    </div>
    <a href="Main.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h3l2-5 3 10 2-5h2.5"></path></svg>现场<span style="margin-left: auto; font-size: 11.5px; color: #2F5BEA; font-weight: 600">2</span></a>
    <a href="Tasks.dc.html" class="on"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"></path></svg>任务</a>
    <a href="Desktop.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5l4 11 1.7-4.6L13.5 7z"></path></svg>桌面控制</a>
    <a href="Settings.dc.html"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5 2v4.1c0 3-2.1 5.3-5 6.3-2.9-1-5-3.3-5-6.3V3.8z"></path></svg>设置与安全</a>
    <div style="flex-grow: 1; min-height: 24px"></div>
    <div style="background: #fff; border: 1px solid #E3E2DD; border-radius: 9px; padding: 10px 12px">
      <div class="row" style="gap: 8px"><span class="dot" style="background: #1F9D5C"></span><span style="font-weight: 550">已连接</span><span class="label mono" style="margin-left: auto">38 ms</span></div>
      <div class="label mono" style="margin-top: 4px">203.0.113.10:7443</div>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 16px">
    <header style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
      <div style="flex: 1 1 280px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">任务</h1>
        <p style="margin: 4px 0 0; color: #6B6A66">每个任务按编号只记一次。查询、心跳和重复请求不计数。</p>
      </div>
      <label style="flex: 0 1 300px; display: flex; align-items: center; gap: 8px; border: 1px solid #DAD9D4; background: #fff; border-radius: 8px; padding: 0 10px; min-height: 34px">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="color: #6B6A66"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg>
        <span style="position: absolute; left: -9999px">搜索任务</span>
        <input type="search" placeholder="命令、目录或任务编号" style="border: 0; outline: none; font: inherit; flex-grow: 1; min-width: 0; background: transparent">
      </label>
    </header>

    <div role="group" aria-label="按状态筛选" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
        <button class="{{f.cls}}" onClick="{{f.pick}}"><span class="dot" style="background: {{f.dot}}"></span>{{f.label}}<span class="mono" style="opacity: .7">{{f.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section aria-label="任务列表" class="card" style="flex: 1 1 360px; min-width: 0; overflow: hidden">
        <sc-for list="{{list}}" as="t" hint-placeholder-count="8">
          <button class="{{t.cls}}" onClick="{{t.pick}}">
            <span class="dot" style="background: {{t.dot}}; margin-top: 6px"></span>
            <span style="min-width: 0; flex-grow: 1">
              <span class="mono" style="display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px">{{t.title}}</span>
              <span class="label" style="display: block">{{t.kind}} · {{t.when}}</span>
            </span>
            <span style="text-align: right; flex-shrink: 0">
              <span style="display: block; font-size: 12px; color: {{t.fg}}; font-weight: 550">{{t.stLabel}}</span>
              <span class="label mono" style="display: block">{{t.dur}}</span>
            </span>
          </button>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
          <div class="label" style="padding: 28px; text-align: center">这个状态下没有任务</div>
        </sc-if>
      </section>

      <section aria-label="任务详情" class="card" style="flex: 999 1 420px; min-width: 0; padding: 20px">
        <div class="row" style="flex-wrap: wrap">
          <span class="tag" style="background: {{sel.bg}}; color: {{sel.fg}}; font-weight: 550">{{sel.stLabel}}</span>
          <span class="tag">{{sel.kind}}</span>
          <span class="label" style="margin-left: auto">{{sel.when}}</span>
        </div>
        <div class="mono" style="font-size: 15px; margin: 12px 0 16px; word-break: break-all">{{sel.title}}</div>

        <div style="background: {{sel.bg}}; color: {{sel.fg}}; border-radius: 8px; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="margin-top: 2px"><circle cx="8" cy="8" r="6"></circle><path d="M8 5v3.5M8 11h.01"></path></svg>
          <span>{{sel.explain}}</span>
        </div>

        <div class="kv" style="margin-top: 18px">
          <span class="label">工作目录</span><span class="mono" style="word-break: break-all">{{sel.cwd}}</span>
          <span class="label">耗时</span><span class="mono">{{sel.dur}}</span>
          <span class="label">退出码</span><span class="mono">{{sel.exit}}</span>
          <span class="label">任务编号</span><span class="mono" style="word-break: break-all">{{sel.taskId}}</span>
        </div>

        <div class="row" style="margin: 20px 0 8px"><span class="label">输出</span><span class="label" style="margin-left: auto">{{sel.outNote}}</span></div>
        <div class="term mono">{{sel.output}}</div>

        <div class="row" style="margin-top: 16px; flex-wrap: wrap">
          <button class="btn">复制任务编号</button>
          <button class="btn">打开完整日志</button>
          <sc-if value="{{sel.isUnknown}}" hint-placeholder-val="{{false}}">
            <button class="btn">截一张当前屏幕核对</button>
          </sc-if>
          <sc-if value="{{sel.isRunning}}" hint-placeholder-val="{{false}}">
            <button class="btn danger" style="margin-left: auto">取消任务</button>
          </sc-if>
        </div>
      </section>
    </div>
  </main>
</div></template>
<template id="t-Desktop"><div class="app" style="display: flex; flex-wrap: wrap; min-height: 900px; background: #FBFBFA">

  <nav class="nav" aria-label="主导航" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; background: #F2F2EF; border-right: 1px solid #E6E5E1; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">

      </div>
      <div>
        <div style="font-weight: 600; font-size: 14.5px">Macrun</div>
        <div class="label" style="font-size: 11.5px">执行器 · v0.2.0</div>
      </div>

<template id="t-Pairing"><div class="app" style="width: 800px; height: 580px; box-sizing: border-box; background: #FBFBFA; border-radius: 12px; overflow: hidden; display: flex; box-shadow: 0 0 0 1px #E3E2DD">

    <div style="flex-grow: 1"></div>

macrun://203.0.113.10:7443/pair?code=K7QF-29XM&amp;fp=4FA19C07</div>

defs["Pairing"] = (function () {
class Component extends DCLogic {
  renderVals() {
    const step = (this.state && this.state.step) || 1;

    return {

      back: () => this.setState({ step: Math.max(1, step - 1) }),
      reset: () => this.setState({ step: 1 }),
      steps: names.map((label, i) => {

        const done = n < step, cur = n === step;

function lookup(scope, expr) {
  if (expr === 'true') return true;
  if (expr === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  return expr.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
}
function interp(text, scope) {
  return text.replace(HOLE, (_, p) => { const v = lookup(scope, p); return v == null ? '' : String(v); });
}
function renderChildren(src, dst, scope) { for (const n of src.childNodes) renderNode(n, dst, scope); }
function renderNode(n, dst, scope) {
  if (n.nodeType === 3) { dst.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-if') {
    const m = (n.getAttribute('value') || '').match(WHOLE);
    if (m && lookup(scope, m[1])) renderChildren(n, dst, scope);
    return;
  }
  if (tag === 'sc-for') {
    const m = (n.getAttribute('list') || '').match(WHOLE);
    const list = (m && lookup(scope, m[1])) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((item, i) => renderChildren(n, dst, Object.assign({}, scope, { [as]: item, $index: i })));
    return;
  }
  const el = n.namespaceURI === SVG ? document.createElementNS(SVG, tag) : document.createElement(tag);
  for (const a of n.attributes) {
    const m = a.value.match(WHOLE);
    if (a.name.startsWith('hint-')) continue;
    if (/^on[a-z]+$/.test(a.name) && m) {
      const fn = lookup(scope, m[1]);
      if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn);
      continue;
    }
    if (a.name === 'checked' || a.name === 'defaultchecked') { el.checked = m ? !!lookup(scope, m[1]) : true; continue; }
    el.setAttributeNS(a.namespaceURI, a.name, interp(a.value, scope));
  }
  renderChildren(n, el, scope);
  dst.appendChild(el);
}

const instances = {};
const host = document.getElementById('screen');
const root = host.attachShadow({ mode: 'open' });
let current = null;

function paint() {
  const s = SCREENS.find((x) => x.id === current);
  const inst = instances[s.id];
  const frag = document.createDocumentFragment();
  const style = document.createElement('style');
  style.textContent = ':host{display:block}\n' + s.style;
  frag.appendChild(style);
  renderChildren(document.getElementById('t-' + s.id).content, frag, inst.renderVals());
  root.replaceChildren(frag);
}

function show(id) {
  const s = SCREENS.find((x) => x.id === id) || SCREENS[0];
  current = s.id;
  if (!instances[s.id]) instances[s.id] = new defs[s.id](Object.assign({}, s.defaults), () => { if (current === s.id) paint(); });
  document.getElementById('stage').className = 'stage ' + s.kind;
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', String(b.dataset.id === s.id));
  paint();
  const shot = document.documentElement.classList.contains('shot');
  history.replaceState(null, '', (shot ? '#shot/' : '#') + s.id);
  window.scrollTo(0, 0);
}

root.addEventListener('click', (e) => {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (href.endsWith('.dc.html')) { e.preventDefault(); show(href.replace('.dc.html', '')); }
  else if (href.startsWith('#')) { e.preventDefault(); const t = root.getElementById(href.slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth' }); }
});

const tabs = document.getElementById('tabs');
for (const s of SCREENS) {
  const b = document.createElement('button');
  b.type = 'button'; b.role = 'tab'; b.dataset.id = s.id; b.textContent = s.label;
  b.addEventListener('click', () => show(s.id));
  tabs.appendChild(b);
}

let start = location.hash.slice(1);
if (start.startsWith('shot/')) { document.documentElement.classList.add('shot'); start = start.slice(5); }
show(start);
</script>
